name: Our Place
description: >-
  Our Place is a direct-to-consumer kitchenware and cookware brand, best known for
  the multi-purpose Always Pan, selling cookware, bakeware, appliances, tableware, and
  kitchen tools at fromourplace.com. Surfaced as a portfolio company of 8vc, its digital
  storefront runs on Shopify and exposes a native agentic-commerce surface: a Universal
  Commerce Protocol (UCP) merchant profile, a hosted Model Context Protocol (MCP) shopping
  endpoint, Shopify Customer Account OpenID Connect authentication, and an agent-facing
  llms.txt / agents.md. This profile was enriched by the API Evangelist pipeline from the
  company's live public agent surface.
