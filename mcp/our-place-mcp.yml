generated: '2026-07-20'
method: searched
source: https://fromourplace.com/.well-known/ucp + https://fromourplace.com/llms.txt
name: Our Place UCP Shopping MCP
status: hosted
description: >-
  Our Place (fromourplace.com) exposes a live, hosted Model Context Protocol
  server for agent-driven commerce via the Universal Commerce Protocol (UCP),
  provided natively by the Shopify platform. Agents discover it through the
  store's /.well-known/ucp merchant profile and /llms.txt. Completing a
  checkout requires explicit buyer approval.
transport: streamable-http
protocol: ucp
endpoints:
- url: https://fromourplace.com/api/ucp/mcp
  method: POST
  note: primary storefront-domain MCP endpoint
- url: https://fromourplace-com.myshopify.com/api/ucp/mcp
  method: POST
  note: canonical myshopify endpoint from the UCP profile
discovery:
  ucp_profile: https://fromourplace.com/.well-known/ucp
  llms_txt: https://fromourplace.com/llms.txt
  agents_md: https://fromourplace.com/agents.md
ucp:
  version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  service: dev.ucp.shopping
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  capabilities:
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.order
tools:
# Documented in the store's own /llms.txt agent flow; the live tools/list
# handshake requires an agent profile URI (422 without one), so these are the
# provider-documented UCP shopping tools rather than a fabricated list.
- name: search_catalog
  description: Search the store catalog for products matching buyer intent.
- name: create_cart
  description: Create a cart and add desired items.
- name: create_checkout
  description: Start the purchase flow from a cart.
- name: update_checkout
  description: Set shipping address and delivery method on a checkout.
- name: complete_checkout
  description: Finalize the purchase. Requires explicit buyer payment approval.
notes:
- Checkout requires contemporaneous human/buyer approval; agents must not complete payment autonomously.
- MCP endpoint is per-IP rate limited; back off on HTTP 429.
- Read-only browsing is available without auth via Shopify storefront JSON (/products/{handle}.json, /collections/{handle}/products.json).
